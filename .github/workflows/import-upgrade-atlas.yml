name: Slice approved ZombieZero upgrade atlas
on:
  push:
    branches: [main]
    paths:
      - 'dist/assets/ui/upgrade-atlas-v198.png'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  slice:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare Pillow
        run: python -m pip install --quiet pillow
      - name: Slice approved local PNG into UI WebP parts
        run: python tools/slice_upgrade_atlas.py
      - name: Commit derived transparent bitmap UI sprites
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/assets/ui/upgrade-*-v198.webp dist/assets/ui/upgrade-atlas-v198-manifest.json
          if git diff --cached --quiet; then
            echo "No atlas slice changes"
            exit 0
          fi
          git commit -m "Generate upgrade UI bitmap sprites from approved atlas v198"
          git push origin HEAD:main
