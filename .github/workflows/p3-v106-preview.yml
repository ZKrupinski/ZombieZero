name: Build v106 trash-can original HD strips

on:
  push:
    branches: [fix/p3-trash-v106-clean-crops-no-spin]
    paths:
      - tools/generate_p3_trash_v106.py
      - .github/workflows/p3-v106-preview.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v106-trash-artifacts
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "Pillow>=10,<12"
      - run: python tools/generate_p3_trash_v106.py
      - run: python tools/generate_p3_trash_v106.py --verify
      - name: Commit two lossless PNGs and contact sheet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/p3-v106-trash-can-preview.jpg dist/assets/ip/v2/p3-deaths/trash_can-normal-v106.png dist/assets/ip/v2/p3-deaths/trash_can-critical-v106.png
          if ! git diff --cached --quiet; then
            git commit -m "assets(p3-v106): clean original HD trash-can frames, zero spin"
            git fetch origin fix/p3-trash-v106-clean-crops-no-spin
            git rebase origin/fix/p3-trash-v106-clean-crops-no-spin
            git push origin HEAD:fix/p3-trash-v106-clean-crops-no-spin
          fi
