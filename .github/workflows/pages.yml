name: Deploy ZombieZero to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct approved 36-throwable atlas
        run: node tools/rebuild-throwables-atlas-v237.cjs
      - name: Polish isolated projectile fragments
        run: node tools/polish-throwables-atlas-v238.cjs
      - name: Check game
        run: node tools/test.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clean green zombie death atlas perimeter
        run: |
          python -m pip install 'Pillow>=10,<12'
          python tools/clean-green-death-fringe-v360.py
          python tools/clean-death-matte-v455.py --preview "$RUNNER_TEMP/death-matte-v455.png"
      - name: Save death sprite QA preview
        uses: actions/upload-artifact@v4
        with:
          name: death-matte-v455-before-after
          path: ${{ runner.temp }}/death-matte-v455.png
          if-no-files-found: error
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # GitHub's artifact index can lag behind a successful upload.
      - name: Let Pages artifact metadata become available
        run: sleep 15
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
