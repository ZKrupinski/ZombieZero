name: Build P3 original boss death sheets

on:
  push:
    branches: [main]
    paths:
      - tools/generate_p3_boss_deaths.py
      - .github/workflows/generate-p3-bosses.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p3-boss-sheets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image library
        run: python -m pip install "Pillow>=10,<12"
      - name: Generate four original-HD boss atlases
        run: |
          python tools/generate_p3_boss_deaths.py
          python tools/generate_p3_boss_deaths.py --verify
      - name: Publish the four transparent PNG strips
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/assets/ip/v2/p3-deaths/*.png
          if git diff --cached --quiet; then
            echo "P3 sprites unchanged."
          else
            git commit -m "assets(p3): publish four canonical-HD 12-frame boss death PNGs"
            git push origin HEAD:main
          fi
