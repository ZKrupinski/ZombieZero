name: Game regressions
on:
  push:
    branches:
      - art/original-ip-foundation-20261113
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "Pillow>=10,<12"
      - run: python tools/inspect_winter_bg_v157.py
      - run: python tools/generate_p3_boss_deaths.py --verify
      - run: python tools/generate_p3_trash_v106.py --verify
      - run: node tools/test.cjs
