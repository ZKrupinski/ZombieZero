name: Build ZOMBIE BALLS Android APK
on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'native/android-shell/**'
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zombie-balls-android-debug
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare the same game assets as Pages
        run: |
          node tools/rebuild-throwables-atlas-v237.cjs
          node tools/polish-throwables-atlas-v238.cjs
          node tools/test.cjs
          python -m pip install 'Pillow>=10,<12'
          python tools/clean-green-death-fringe-v360.py
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Verify Android SDK
        run: |
          command -v sdkmanager
          sdkmanager --version
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
      - name: Install pinned Capacitor and generate native project
        working-directory: native/android-shell
        run: |
          npm install --no-audit --no-fund
          python prepare.py web
          npx cap add android
          python prepare.py android
          npx cap sync android
      - name: Restore test signing key (not a release key)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: zombie-balls-android-debug-signing-v1
      - name: Generate test key if absent
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          fi
      - name: Assemble and verify APK
        working-directory: native/android-shell/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk"
          unzip -l "$apk" | grep -F 'assets/public/index.html'
          mkdir -p ../../../android-artifacts
          cp "$apk" ../../../android-artifacts/ZOMBIE-BALLS-debug.apk
          printf 'commit=%s\nrun=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" > ../../../android-artifacts/build-info.txt
          (cd ../../../android-artifacts && sha256sum ZOMBIE-BALLS-debug.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: ZOMBIE-BALLS-Android-APK
          path: android-artifacts/
          if-no-files-found: error
          retention-days: 30
